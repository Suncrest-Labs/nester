name: Smart Contract Audit

on:
  push:
    branches: ["main"]
    paths:
      - "packages/contracts/**"
      - "scripts/contract-audit.sh"
      - ".github/workflows/contract-audit.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - "scripts/contract-audit.sh"
      - ".github/workflows/contract-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  x402-audit:
    name: x402 Heuristic Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Make audit script executable
        run: chmod +x scripts/contract-audit.sh

      - name: Run pre-deploy contract audit
        env:
          X402_PAYMENT_PROOF: ${{ secrets.X402_PAYMENT_PROOF }}
          CONTRACT_AUDIT_ADDRESSES: ${{ vars.CONTRACT_AUDIT_ADDRESSES }}
          CONTRACT_AUDIT_API_URL: ${{ vars.CONTRACT_AUDIT_API_URL }}
        run: ./scripts/contract-audit.sh

      - name: Build contracts and calculate WASM hashes
        run: |
          cd packages/contracts
          rustup target add wasm32-unknown-unknown
          # Build only deployable workspace-member contracts. Match on the manifest
          # path relative to workspace_root -- an absolute-substring match on
          # "/contracts/" also matches libs/ and tests/, because the workspace root
          # directory is itself named "contracts". Those crates depend on
          # soroban-sdk with the "testutils" feature, which cannot compile for wasm.
          # Requiring a cdylib target additionally excludes rlib-only helper crates.
          cat > /tmp/list-contract-packages.py <<'PY'
          import sys, json, os

          meta = json.load(sys.stdin)
          root = meta['workspace_root'].replace('\\', '/').rstrip('/')
          for pkg in meta['packages']:
              path = pkg['manifest_path'].replace('\\', '/')
              rel = os.path.relpath(path, root).replace('\\', '/')
              if not rel.startswith('contracts/'):
                  continue
              if '/test_fixtures/' in '/' + rel:
                  continue
              if not any('cdylib' in t['kind'] for t in pkg['targets']):
                  continue
              print(pkg['name'])
          PY
          cargo metadata --no-deps --format-version 1 \
            | python3 /tmp/list-contract-packages.py \
            | while read pkg_name; do
                echo "Building $pkg_name..."
                cargo build --release --target wasm32-unknown-unknown -p "$pkg_name"
              done
          mkdir -p ../../wasm-hashes
          echo "# Reproducible WASM Hashes" > ../../wasm-hashes/wasm-hashes.txt
          echo "Generated on: $(date -u)" >> ../../wasm-hashes/wasm-hashes.txt
          echo "" >> ../../wasm-hashes/wasm-hashes.txt
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              hash=$(sha256sum "$wasm" | awk '{print $1}')
              name=$(basename "$wasm")
              echo "$hash  $name" >> ../../wasm-hashes/wasm-hashes.txt
            fi
          done
          cat ../../wasm-hashes/wasm-hashes.txt

      - name: Upload WASM Hashes Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-wasm-hashes
          path: wasm-hashes/wasm-hashes.txt

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-audit-reports
          path: audit-report-*.json
          if-no-files-found: ignore

