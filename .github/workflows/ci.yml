name: CI

# Path-filtered build and test jobs. Security scanning lives in security.yml and
# scheduled work in nightly.yml; nothing here runs a tool that those own, so
# every tool runs exactly once per change.
#
# Required status checks (see docs/security/ci-gates.md): "CI gate". It
# aggregates every job below, so a job skipped by the path filter counts as a
# pass and a failed or cancelled job blocks the merge.

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which areas of the monorepo a change touches so downstream jobs can
  # skip work they do not need. Filters live in .github/path-filters.yml.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      website: ${{ steps.filter.outputs.website }}
      dapp: ${{ steps.filter.outputs.dapp }}
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
      observability: ${{ steps.filter.outputs.observability }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@b41dfa943b1939b9b646f67753bfe35cf6e4de03 # v3.0.2
        id: filter
        with:
          # On push events compare against the previous commit; on PRs this
          # defaults to the merge base.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: .github/path-filters.yml

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          node: "true"
          node-version: "20"

      - name: Build website
        run: pnpm --filter @nester/website build

      - name: Lint website
        run: pnpm --filter @nester/website lint

  dapp:
    name: Dapp
    needs: changes
    if: needs.changes.outputs.dapp == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          node: "true"

      # Gates on the security ruleset (nester#1236). The full `lint` surface
      # reports pre-existing style and react-hooks errors in files no security
      # change touched; it is not part of this gate because a required check
      # cannot be non-blocking.
      - name: Lint (security rules)
        run: pnpm --filter @nester/dapp run lint:security

      - name: Build
        run: pnpm --filter @nester/dapp run build

      - name: Test
        run: pnpm --filter @nester/dapp run test:coverage

      # Browser-level tests. These specs force their failure modes with route
      # interception (a blocked WebSocket, a stalled API response) rather than a
      # real backend, so they need nothing but the dev server that
      # playwright.config.ts starts on :3001. smoke.spec.ts is excluded by that
      # config: it is full-stack and runs post-deploy in deploy-staging.yml.
      - name: Install Playwright browsers
        run: pnpm --filter @nester/dapp exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @nester/dapp run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/dapp/frontend/playwright-report/
          retention-days: 7

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nester
          POSTGRES_PASSWORD: nester
          POSTGRES_DB: nester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nester:nester@localhost:5432/nester_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      # Redis-backed tests (internal/cache, internal/notifications,
      # internal/ws) skip via t.Skip when this is unset, following the
      # convention in internal/middleware/ratelimit_backend_test.go. REDIS_URL
      # above is what the app itself reads; without this, every such test
      # silently skips in CI even though the redis service is running.
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          go: "true"

      - name: Check migration collisions
        run: |
          COLLISIONS=$(ls migrations/*.sql \
            | sed -E 's/\.(up|down)\.sql$//' \
            | sort -u \
            | sed -E 's/.*\/([0-9]+)_.*/\1/' \
            | sort | uniq -d)
          if [ -n "$COLLISIONS" ]; then
            echo "FAIL: duplicate migration prefixes found:"
            for prefix in $COLLISIONS; do
              echo "Prefix $prefix:"
              ls migrations/${prefix}_*.sql
            done
            exit 1
          else
            echo "OK: No migration prefix collisions."
          fi

      # Collision checking above proves the chain is well-named, not that it
      # works. This applies every migration from scratch, seeds the result, then
      # rolls the whole chain back down: reversibility breaks against data, not
      # against an empty schema (issue #1123). A migration that is deliberately
      # irreversible says so with a `migration:irreversible` marker in its
      # .down.sql.
      - name: Check migration safety (up, seed, down)
        run: go run -tags migrationsafety ./scripts/verify_migrations.go -dir migrations

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: staticcheck
        run: staticcheck ./...

      # Issue #1058: the committed spec is a build artifact, not a
      # hand-maintained document; this check gives that teeth.
      - name: Check OpenAPI spec is up to date
        run: go run ./cmd/openapi-gen -check openapi.yaml

      # The env var reference is generated from the config loader, so an
      # added, renamed or re-defaulted variable must regenerate the doc.
      - name: Check API config reference is up to date
        run: go run ./cmd/config-doc -check ../../docs/api-config.md

      - name: Test (unit)
        run: go test -race -timeout 120s -count=1 -short ./...

      # Database-backed tests gate on TEST_DATABASE_DSN, not DATABASE_URL.
      # -p 1: the tests share one database and each wipes the public schema
      # before applying the full migration chain, so packages must not run
      # concurrently. No -run filter: DB-gated tests whose names lack
      # "Integration" (internal/audit, internal/stellar backfill) must run too.
      - name: Test (database integration)
        env:
          TEST_DATABASE_DSN: postgres://nester:nester@localhost:5432/nester_test?sslmode=disable
        run: go test -race -timeout 900s -count=1 -p 1 ./...

      - name: Test (property-based vault arithmetic)
        env:
          RAPID_CHECKS: "32"
          RAPID_SEED: "29062026"
        run: go test -timeout 60s -run PropertyBased -v ./internal/domain/vault

  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          rust: "true"

      - name: Build yield_registry WASM
        run: cargo build --release --target wasm32-unknown-unknown -p yield-registry-contract

      - name: Ensure yield_registry.wasm is available for allocation_strategy
        run: test -f target/wasm32-unknown-unknown/release/yield_registry.wasm

      - name: Build allocation_strategy WASM
        run: cargo build --release --target wasm32-unknown-unknown -p allocation-strategy-contract

      - name: Build vault_token WASM (required for vault-contract tests)
        run: cargo build --release --target wasm32-unknown-unknown -p vault-token-contract

      - name: Ensure vault_token.wasm is available for vault-contract tests
        run: test -f target/wasm32-unknown-unknown/release/vault_token.wasm

      - name: Test contracts
        env:
          PROPTEST_RNG_SEED: "29062026"
        run: cargo test --lib

      - name: Run deterministic share-accounting properties
        env:
          PROPTEST_CASES: "32"
          PROPTEST_RNG_SEED: "29062026"
        run: cargo test -p nester-integration-tests property_tests

      # The vault contract's integration tests link against the pre-compiled
      # vault_token.wasm artifact built above. Run them explicitly and fail the
      # job if zero tests execute: a green run with no tests would otherwise
      # give false confidence that the contract logic was verified.
      - name: Run vault-contract tests
        run: |
          if ! output=$(cargo test -p vault-contract 2>&1); then
            echo "$output"
            echo "ERROR: vault-contract tests failed to build or run"
            exit 1
          fi
          echo "$output"
          # \b0 only matches a standalone zero, so "10 tests" / "40 passed"
          # never trip this guard, only a genuinely empty run does.
          if echo "$output" | grep -qE '\b0 tests'; then
            echo "ERROR: No vault-contract tests ran — possible missing WASM artifact"
            exit 1
          fi

      # Compile-only: the fuzz crate targets vault-contract's public
      # conversion module directly and is not a member of this workspace
      # (nester#1350), so nothing above would catch it bitrotting. The
      # randomized run happens in nightly.yml.
      - name: Check vault-contract fuzz target compiles
        working-directory: packages/contracts/contracts/vault/fuzz
        run: cargo check --bin conversion_math

      - name: Verify contract WASM size limits
        run: |
          LIMIT=131072
          HEADROOM=4096
          MAX_ALLOWED=$((LIMIT - HEADROOM))
          FAILED=0
          echo "### Contract WASM Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size (bytes) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            [ -f "$wasm" ] || continue
            name=$(basename "$wasm")
            size=$(wc -c < "$wasm" | tr -d ' ')
            if [ "$size" -gt "$MAX_ALLOWED" ]; then
              echo "| $name | $size | Exceeds limit ($MAX_ALLOWED bytes) |" >> $GITHUB_STEP_SUMMARY
              echo "ERROR: $name is $size bytes (exceeds $MAX_ALLOWED limit)"
              FAILED=1
            else
              echo "| $name | $size | OK |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more deployable contracts exceed network size limit"
            exit 1
          fi

      # Blocking gate (#1484): format violations fail the job.
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Blocking gate (#1484): clippy warnings are errors, so a lint introduced
      # by a toolchain bump also blocks the PR.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Full integration suite (#1483): no filter, so every test in
      # nester-integration-tests executes.
      - name: Run integration tests
        run: cargo test -p nester-integration-tests

      # Reproducible WASM hashes (moved from contract-audit.yml). The three
      # crates above are already built; cargo skips them and builds only the
      # remaining deployable crates, so contracts are not compiled twice.
      - name: Build deployable contracts and calculate WASM hashes
        working-directory: .
        run: |
          cargo metadata --manifest-path packages/contracts/Cargo.toml --no-deps --format-version 1 \
            | python3 scripts/list_contract_packages.py \
            | while read -r pkg_name; do
                echo "Building $pkg_name..."
                cargo build --manifest-path packages/contracts/Cargo.toml --release --target wasm32-unknown-unknown -p "$pkg_name"
              done
          mkdir -p wasm-hashes
          {
            echo "# Reproducible WASM Hashes"
            echo "Generated on: $(date -u)"
            echo ""
            for wasm in packages/contracts/target/wasm32-unknown-unknown/release/*.wasm; do
              [ -f "$wasm" ] && echo "$(sha256sum "$wasm" | awk '{print $1}')  $(basename "$wasm")"
            done
          } > wasm-hashes/wasm-hashes.txt
          cat wasm-hashes/wasm-hashes.txt

      - name: Upload WASM hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-wasm-hashes
          path: wasm-hashes/wasm-hashes.txt

  # SLO rules (nester#1056). Validates the recording and alerting rules and
  # runs the burn-rate unit tests against the same files Prometheus loads, so a
  # threshold edited without updating its arithmetic fails the build rather than
  # being discovered during an incident.
  observability:
    name: Observability
    needs: changes
    if: needs.changes.outputs.observability == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install promtool and amtool
        run: |
          set -euo pipefail
          PROM_VERSION=3.1.0
          AM_VERSION=0.28.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "alertmanager-${AM_VERSION}.linux-amd64/amtool"
          promtool --version
          amtool --version

      - name: Check Prometheus config and rules
        run: promtool check config docker/prometheus/prometheus.yml

      - name: Check Alertmanager config
        run: amtool check-config docker/alertmanager/alertmanager.yml

      # Proves the fast-burn alert fires on an induced burst, the slow-burn
      # alert tickets without paging, a healthy system stays quiet, and the
      # thresholds behave at the boundary.
      - name: Run burn-rate alert tests
        working-directory: docker/prometheus/rules
        run: promtool test rules slo_alerts_test.yml slo_probe_alerts_test.yml slo_money_path_alerts_test.yml ttl_alerts_test.yml

      # The probes create real staging transactions, so their safety guards (no
      # default target, production-name and production-URL refusal, mutations
      # opt-in) are the part that must never regress.
      - name: Run synthetic probe tests
        working-directory: tests/probes
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q

      # The dashboards are generated from scripts/build_slo_dashboards.py so the
      # panels and thresholds stay consistent across four files. Committing the
      # output means Grafana loads exactly what is reviewed; this step stops the
      # two drifting apart.
      - name: Check SLO dashboards are up to date
        run: |
          set -euo pipefail
          python3 scripts/build_slo_dashboards.py
          if ! git diff --quiet -- docker/grafana/dashboards; then
            echo "::error::Generated dashboards differ from the committed ones."
            echo "Run: python scripts/build_slo_dashboards.py, then commit the result."
            git diff --stat -- docker/grafana/dashboards
            exit 1
          fi

  # The single required status check for this workflow. A path-skipped job
  # reports "skipped", which this treats as a pass; failure or cancellation of
  # any job blocks the merge.
  ci-gate:
    name: CI gate
    needs: [changes, website, dapp, api, contracts, observability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A CI job finished with result '$result'."
              exit 1
            fi
          done
