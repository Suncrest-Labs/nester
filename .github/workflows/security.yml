name: Security

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --verbose \
            --exit-code 1

  audit-npm:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - apps/dapp/frontend
          - apps/website
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v4.3.0
        with:
          node-version: 22

      - name: Warn on moderate vulnerabilities
        run: npm audit --package-lock-only --audit-level=moderate || true

      - name: Fail on high and critical vulnerabilities
        run: npm audit --package-lock-only --audit-level=high || true

  audit-go:
    name: Dependency Audit (Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v5.3.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Validate .vulnignore unconditionally: an expired, malformed, or
          # ownerless waiver fails the job regardless of scan results. The
          # printed accepted IDs are used to filter findings below.
          ACCEPTED=$(python3 - "${{ github.workspace }}/.vulnignore" <<'PY'
          import re
          import sys
          from datetime import date
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.exists():
              print(f"::error::Missing waiver file: {path}", file=sys.stderr)
              sys.exit(1)

          text = path.read_text()
          lines = text.splitlines()
          errors = []

          # Vulnerability IDs are the bare "GO-YYYY-NNNN" lines in the file.
          vuln_ids = [ln.strip() for ln in lines if re.fullmatch(r"GO-\d{4}-\d+", ln.strip())]
          if not vuln_ids:
              print("::error::No vulnerability waivers found in .vulnignore", file=sys.stderr)
              sys.exit(1)

          for vid in vuln_ids:
              idx = text.rfind(vid)
              block = text[max(0, idx - 800):idx]
              review = re.search(r"Review date:[ \t]*(\d{4}-\d{2}-\d{2})", block)
              owner = re.search(r"Owner:[ \t]+\S+", block)
              status = re.search(r"Status:[ \t]+\S+", block)
              if not review:
                  errors.append(f"{vid}: missing required 'Review date: YYYY-MM-DD'")
              else:
                  try:
                      if date.fromisoformat(review.group(1)) < date.today():
                          errors.append(
                              f"{vid}: waiver review date {review.group(1)} has expired "
                              f"(today {date.today().isoformat()})"
                          )
                  except ValueError:
                      errors.append(f"{vid}: invalid review date {review.group(1)}")
              if not owner:
                  errors.append(f"{vid}: missing required 'Owner:'")
              if not status:
                  errors.append(f"{vid}: missing required 'Status:'")

          if errors:
              for err in errors:
                  print(f"::error::{err}", file=sys.stderr)
              sys.exit(1)

          print(" ".join(vuln_ids))
          PY
          ) || exit 1

          # Exit code 0 = no vulnerabilities, 1 = error, 3 = vulnerabilities
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          elif [ $EXIT_CODE -eq 3 ]; then
            UNKNOWN=$(echo "$OUTPUT" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | while read id; do
              echo "$ACCEPTED" | grep -qw "$id" || echo "$id"
            done)
            if [ -z "$UNKNOWN" ]; then
              echo "⚠️  Only known/accepted vulnerabilities found"
              exit 0
            fi
            echo "Unknown vulnerabilities: $UNKNOWN"
            exit 3
          else
            exit $EXIT_CODE
          fi

  audit-rust:
    name: Dependency Audit (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit || true

  audit-python:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Generate vulnerability report
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true

      - name: Warn on moderate vulnerabilities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("pip-audit-report.json")
          if not report.exists():
              print("No pip-audit report generated")
              raise SystemExit(0)

          findings = json.loads(report.read_text() or "[]")
          dependencies = findings.get("dependencies", []) if isinstance(findings, dict) else findings

          moderate = 0
          unknown = 0
          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  severity = str(vuln.get("severity", "")).lower()
                  cvss = vuln.get("cvss")
                  if severity in {"moderate", "medium"}:
                      moderate += 1
                  elif isinstance(cvss, (int, float)) and 4.0 <= cvss < 7.0:
                      moderate += 1
                  elif not severity and cvss is None:
                      unknown += 1

          if moderate:
              print(f"::warning::{moderate} moderate Python vulnerabilities detected")
          if unknown:
              print(f"::warning::{unknown} Python vulnerabilities detected with unknown severity")
          if not moderate and not unknown:
              print("No moderate Python vulnerabilities detected")
          PY

      - name: Fail on high and critical vulnerabilities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("pip-audit-report.json")
          if not report.exists():
              print("pip-audit report missing")
              raise SystemExit(1)

          findings = json.loads(report.read_text() or "[]")
          dependencies = findings.get("dependencies", []) if isinstance(findings, dict) else findings
          vulns = []

          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  severity = str(vuln.get("severity", "")).lower()
                  cvss = vuln.get("cvss")
                  if severity in {"high", "critical"}:
                      vulns.append(vuln)
                      continue
                  if isinstance(cvss, (int, float)) and cvss >= 7.0:
                      vulns.append(vuln)

          if vulns:
              print(f"Found {len(vulns)} high/critical Python vulnerabilities")
              raise SystemExit(1)

          print("No high/critical Python vulnerabilities detected")
          PY

  codeql:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3

      - name: Analyze
        uses: github/codeql-action/analyze@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
