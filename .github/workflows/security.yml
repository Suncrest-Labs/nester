name: Security

# Every security tool runs exactly once per change, here, in a single job so a
# pull request shows one "Security" check. Language-specific scans are
# path-filtered with the same filters as ci.yml; the scheduled and manual runs
# scan everything. Each scan step runs unless the job was cancelled, so one
# failing scanner never hides another's findings, and any failure fails the job.
#
# CodeQL runs on pushes to dev/main, weekly and on demand, not on pull
# requests: on a PR it adds a check of its own.
#
# Required status checks (see docs/security/ci-gates.md): "Security".

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Scheduled and manual runs have no diff to filter on and scan everything.
      - uses: dorny/paths-filter@b41dfa943b1939b9b646f67753bfe35cf6e4de03 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: .github/path-filters.yml

      - name: Decide what to scan
        id: scope
        env:
          ALL: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
          SHARED: ${{ steps.filter.outputs.shared }}
          JS_ROOT: ${{ steps.filter.outputs.js_root }}
          WEBSITE: ${{ steps.filter.outputs.website }}
          DAPP: ${{ steps.filter.outputs.dapp }}
          API: ${{ steps.filter.outputs.api }}
          CONTRACTS: ${{ steps.filter.outputs.contracts }}
          PYTHON: ${{ steps.filter.outputs.python }}
          CI_SCRIPTS: ${{ steps.filter.outputs.ci_scripts }}
        run: |
          on() { [ "$ALL" = "true" ] || [ "$SHARED" = "true" ] || [ "$1" = "true" ]; }

          js=false;   if on "$WEBSITE" || on "$DAPP" || on "$JS_ROOT"; then js=true; fi
          dapp=false; if on "$DAPP"; then dapp=true; fi
          api=false;  if on "$API"; then api=true; fi
          rust=false; if on "$CONTRACTS"; then rust=true; fi
          py=false;   if on "$PYTHON"; then py=true; fi
          scripts=false; if on "$CI_SCRIPTS"; then scripts=true; fi
          sbom=false; if [ "$api" = true ] || [ "$dapp" = true ] || [ "$rust" = true ]; then sbom=true; fi

          {
            echo "js=$js"
            echo "dapp=$dapp"
            echo "api=$api"
            echo "rust=$rust"
            echo "py=$py"
            echo "scripts=$scripts"
            echo "sbom=$sbom"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # The waiver validator and typosquat check decide what this job lets
      # through, so their own regression tests run before either is trusted.
      - name: Test security scripts
        if: steps.scope.outputs.scripts == 'true'
        run: |
          python3 scripts/test_validate_vulnignore.py
          python3 scripts/test_typosquat_check.py

      # ── Secrets ──────────────────────────────────────────────────────────

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Scans full history. .gitleaksignore (read from the source root) and the
      # allowlist in .gitleaks.toml carry the reviewed false positives.
      - name: Secrets (gitleaks)
        run: gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

      # ── Toolchains ───────────────────────────────────────────────────────

      # pnpm: a workspace with a single root pnpm-lock.yaml, so the audit runs
      # once from the root. It resolves straight from the lockfile and never
      # installs, so there is no pnpm store and no `cache: pnpm` (the post-job
      # cache save would fail on the missing path).
      - name: Setup pnpm
        if: steps.scope.outputs.js == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.1.0

      - name: Setup Node
        if: steps.scope.outputs.js == 'true'
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v4.3.0
        with:
          node-version: 22

      - uses: ./.github/actions/setup
        if: steps.scope.outputs.api == 'true'
        with:
          go: "true"

      - uses: ./.github/actions/setup
        if: steps.scope.outputs.rust == 'true'
        with:
          rust: "true"

      # Pinned (#1221): an unpinned @latest means whatever the registry serves at
      # that moment runs in CI with repository context. The pins live in
      # security-scanner-versions.env; see that file for the update cadence.
      - name: Install Go scanners
        if: steps.scope.outputs.api == 'true'
        run: |
          . "$GITHUB_WORKSPACE/.github/security-scanner-versions.env"
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Install cargo-audit
        if: steps.scope.outputs.rust == 'true'
        run: cargo install cargo-audit --locked

      # ── Dependency audits ────────────────────────────────────────────────

      - name: Dependency audit (pnpm, moderate and above, report only)
        if: ${{ !cancelled() && steps.scope.outputs.js == 'true' }}
        run: pnpm audit --audit-level=moderate || true

      # Enforced at `critical`: every critical advisory is fixed through root
      # pnpm.overrides rather than suppressed, so a new critical breaks the
      # build. #1025 raises this to `high` once the Expo/react-native and
      # Trezor transitive backlog clears upstream.
      - name: Dependency audit (pnpm)
        if: ${{ !cancelled() && steps.scope.outputs.js == 'true' }}
        run: pnpm audit --audit-level=critical

      - name: Dependency audit (govulncheck)
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        working-directory: apps/api
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Validate .vulnignore unconditionally: an expired, malformed, or
          # ownerless waiver fails the job regardless of scan results. The
          # printed accepted IDs are used to filter findings below.
          ACCEPTED=$(python3 "${{ github.workspace }}/scripts/validate_vulnignore.py" "${{ github.workspace }}/.vulnignore") || exit 1

          # Exit code 0 = no vulnerabilities, 1 = error running govulncheck,
          # 3 = vulnerabilities found.
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          elif [ $EXIT_CODE -eq 3 ]; then
            UNKNOWN=$(echo "$OUTPUT" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | while read id; do
              echo "$ACCEPTED" | grep -qw "$id" || echo "$id"
            done)
            if [ -z "$UNKNOWN" ]; then
              echo "Only known/accepted vulnerabilities found"
              exit 0
            fi
            echo "Unknown vulnerabilities: $UNKNOWN"
            exit 3
          else
            exit $EXIT_CODE
          fi

      - name: Dependency audit (cargo-audit)
        if: ${{ !cancelled() && steps.scope.outputs.rust == 'true' }}
        working-directory: packages/contracts
        run: cargo audit

      # ── Static analysis ──────────────────────────────────────────────────

      # Enforcing gate (#1035). gosec -severity medium reports zero issues:
      # genuine defects are fixed and the remainder are annotated per rule at the
      # single line each applies to. No rule is globally disabled, so a new
      # finding fails the build rather than accumulating.
      - name: SAST (gosec)
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        working-directory: apps/api
        run: gosec -severity medium ./...

      # semgrep/semgrep-action is archived; the maintained CLI is run directly,
      # pinned to a released version.
      - name: SAST (semgrep)
        if: ${{ !cancelled() && steps.scope.outputs.dapp == 'true' }}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "::warning::SEMGREP_APP_TOKEN is not configured. Semgrep runs with local rules only. See docs/ci/secrets.md."
          fi
          pip install "semgrep==1.175.0"
          semgrep scan --error --quiet --config p/typescript --config p/react --config p/nextjs --config p/secrets apps/dapp/frontend

      # Compares the base manifest against the head manifest and checks only
      # dependencies added by this change. The script is an advisory heuristic
      # that always exits 0 and reports suspects as workflow warnings, so it
      # cannot block an unrelated PR.
      - name: Typosquat detection (new npm dependencies)
        if: ${{ !cancelled() && steps.scope.outputs.dapp == 'true' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/typosquat_check.py apps/dapp/frontend/package.json "$BASE_REF"

      # ── Container images ─────────────────────────────────────────────────

      # Builds the API and signer images (the two production Dockerfiles that
      # exist today) and scans them for OS/package-level CVEs the source-level
      # scans above never see (#1532). The dapp has no production Dockerfile
      # yet, so there is nothing to scan for it. Images are built and scanned
      # here but not pushed; release images are pushed only by deploy.yml.
      - name: Build images for scanning
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        run: |
          docker build -f apps/api/Dockerfile -t nester-api:scan apps/api
          docker build -f apps/api/Dockerfile.signer -t nester-signer:scan apps/api

      - name: Image scan (api)
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "nester-api:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Image scan (signer)
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "nester-signer:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      # ── SBOM ─────────────────────────────────────────────────────────────

      - name: Install SBOM tools
        if: ${{ !cancelled() && steps.scope.outputs.sbom == 'true' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.api }}" = "true" ]; then
            go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          fi
          SYFT_VERSION=1.50.0
          ASSET="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${ASSET}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${ASSET}"
          curl -sSfL -o "/tmp/syft_${SYFT_VERSION}_checksums.txt" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          cd /tmp
          grep "  ${ASSET}$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ASSET}"
          sudo mv /tmp/syft /usr/local/bin/syft

      - name: Generate Go API SBOM
        if: ${{ !cancelled() && steps.scope.outputs.api == 'true' }}
        working-directory: apps/api
        run: |
          cyclonedx-gomod mod -json -output ../../sbom-api.json .
          syft dir:. --output cyclonedx-json=../../sbom-api-syft.json

      # syft catalogs the pnpm lockfile directly. @cyclonedx/cyclonedx-npm
      # dropped --pnpm support in v6.
      - name: Generate frontend SBOM (npm/pnpm)
        if: ${{ !cancelled() && steps.scope.outputs.dapp == 'true' }}
        working-directory: apps/dapp/frontend
        run: syft dir:. --output cyclonedx-json=../../../sbom-frontend.json

      - name: Generate contracts SBOM (Rust)
        if: ${{ !cancelled() && steps.scope.outputs.rust == 'true' }}
        working-directory: packages/contracts
        run: syft dir:. --output cyclonedx-json=../../sbom-contracts.json

      - name: Upload SBOM artifacts
        if: ${{ !cancelled() && steps.scope.outputs.sbom == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-artifacts
          path: sbom-*.json
          if-no-files-found: error

      # ── Contracts ────────────────────────────────────────────────────────

      - name: Contract audit (x402)
        if: ${{ !cancelled() && steps.scope.outputs.rust == 'true' }}
        env:
          X402_PAYMENT_PROOF: ${{ secrets.X402_PAYMENT_PROOF }}
          CONTRACT_AUDIT_ADDRESSES: ${{ vars.CONTRACT_AUDIT_ADDRESSES }}
          CONTRACT_AUDIT_API_URL: ${{ vars.CONTRACT_AUDIT_API_URL }}
        run: |
          chmod +x scripts/contract-audit.sh
          ./scripts/contract-audit.sh

      - name: Upload audit reports
        if: ${{ !cancelled() && steps.scope.outputs.rust == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-audit-reports
          path: audit-report-*.json
          if-no-files-found: ignore

      # ── CodeQL (not on pull requests) ────────────────────────────────────

      - name: Initialize CodeQL
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/init@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
        with:
          languages: go, javascript-typescript, python

      - name: Autobuild
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/autobuild@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3

      - name: CodeQL analysis
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/analyze@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
