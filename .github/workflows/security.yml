name: Security

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --verbose \
            --exit-code 1

  audit-npm:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4

      # No `cache: pnpm` here on purpose. This job never runs `pnpm install`
      # (audit resolves straight from the lockfile), so the pnpm store is
      # never created and the post-job cache save fails the whole job with
      # "Path Validation Error: Path(s) specified in the action for caching
      # do(es) not exist" even when every audit step passed.
      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v4.3.0
        with:
          node-version: 22

      # This is a pnpm workspace: the single pnpm-lock.yaml at the repo root
      # covers every package, and no package-lock.json exists anywhere. The
      # audit therefore runs once from the root rather than per-directory.
      - name: Warn on moderate and above vulnerabilities
        run: pnpm audit --audit-level=moderate || true

      # Enforced, not suppressed. Repairing this job (it had been failing on
      # ENOLOCK rather than actually auditing) exposed 203 findings; the 6
      # criticals are now fixed outright via root pnpm.overrides and the jspdf
      # 4.x bump, leaving 0 critical. The residual 76 high / 60 moderate are
      # transitive-only under Expo/react-native and Trezor and need upstream
      # releases; #1025 raises this gate to `high` when they land.
      - name: Fail on critical vulnerabilities
        run: pnpm audit --audit-level=critical

  audit-go:
    name: Dependency Audit (Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/api
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v5.3.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Install govulncheck
        # Pinned (#1221): an unpinned @latest means whatever the registry
        # serves at that moment runs in CI with repository context, and a
        # rerun of a green build can turn red with no line changed. The pin
        # lives in security-scanner-versions.env so ci.yml and this workflow
        # can't drift apart; see that file for the update cadence.
        run: |
          . "$GITHUB_WORKSPACE/.github/security-scanner-versions.env"
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run govulncheck
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # Validate .vulnignore unconditionally: an expired, malformed, or
          # ownerless waiver fails the job regardless of scan results. The
          # printed accepted IDs are used to filter findings below.
          ACCEPTED=$(python3 "${{ github.workspace }}/scripts/validate_vulnignore.py" "${{ github.workspace }}/.vulnignore") || exit 1

          # Exit code 0 = no vulnerabilities
          # Exit code 1 = error running govulncheck
          # Exit code 3 = vulnerabilities found

          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          elif [ $EXIT_CODE -eq 3 ]; then
            UNKNOWN=$(echo "$OUTPUT" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | while read id; do
              echo "$ACCEPTED" | grep -qw "$id" || echo "$id"
            done)
            if [ -z "$UNKNOWN" ]; then
              echo "⚠️  Only known/accepted vulnerabilities found"
              exit 0
            fi
            echo "Unknown vulnerabilities: $UNKNOWN"
            exit 3
          else
            exit $EXIT_CODE
          fi

  audit-rust:
    name: Dependency Audit (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  audit-python:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Generate vulnerability report
        # pip-audit exits non-zero when it finds vulnerabilities. That is not a
        # failure of this step — the report is still written and the severity
        # gates below decide what blocks. Only a missing report is fatal, and
        # the gates raise on that themselves.
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json

      - name: Warn on moderate vulnerabilities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("pip-audit-report.json")
          if not report.exists():
              print("No pip-audit report generated")
              raise SystemExit(0)

          findings = json.loads(report.read_text() or "[]")
          dependencies = findings.get("dependencies", []) if isinstance(findings, dict) else findings

          moderate = 0
          unknown = 0
          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  severity = str(vuln.get("severity", "")).lower()
                  cvss = vuln.get("cvss")
                  if severity in {"moderate", "medium"}:
                      moderate += 1
                  elif isinstance(cvss, (int, float)) and 4.0 <= cvss < 7.0:
                      moderate += 1
                  elif not severity and cvss is None:
                      unknown += 1

          if moderate:
              print(f"::warning::{moderate} moderate Python vulnerabilities detected")
          if unknown:
              print(f"::warning::{unknown} Python vulnerabilities detected with unknown severity")
          if not moderate and not unknown:
              print("No moderate Python vulnerabilities detected")
          PY

      - name: Fail on any reported vulnerability
        # pip-audit JSON does not expose severity or cvss fields, so filtering
        # on them would silently drop every finding and let a vulnerable
        # dependency pass. Fail on any reported finding instead.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("pip-audit-report.json")
          if not report.exists():
              print("pip-audit report missing")
              raise SystemExit(1)

          findings = json.loads(report.read_text() or "[]")
          dependencies = findings.get("dependencies", []) if isinstance(findings, dict) else findings
          vulns = []

          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  vulns.append(vuln)

          if vulns:
              print(f"Found {len(vulns)} high/critical Python vulnerabilities")
              for vuln in vulns:
                  print(f"  {vuln.get('id', 'unknown')}: {vuln.get('description', '')[:120]}")
              raise SystemExit(1)

          print("No Python vulnerabilities detected")
          PY

  codeql:
    name: Static Analysis (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3

      - name: Analyze
        uses: github/codeql-action/analyze@f02afd42b08e9c7fd2198fe321a96e6b3867a0fd # v3
