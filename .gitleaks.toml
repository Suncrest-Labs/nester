[extend]
useDefault = true

[allowlist]
description = "Exclude generated build artifacts, dependency trees, and local env files"
paths = [
    '''.next/''',
    '''\.venv/''',
    '''node_modules/''',
    '''target/''',
    '''\.env$''',
    '''\.env\..*''',
    '''apps/intelligence/\.env''',
]
# Stellar testnet secret key that appears in the (now-removed) internal/stellar test
# fixtures. The files are deleted from the working tree, but the Secret Detection job
# scans full git history (fetch-depth: 0), so this known, intentionally-public testnet
# account must stay allowlisted to keep history scans green. Not a production credential.
regexes = [
    '''SBVH6U5PEFXPXPJ4GPXVYACRF4NZQA5QBCZLLPQGHXWWK6NXPV6IYGG''',
]
