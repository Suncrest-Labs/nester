[package]
name = "adapter-soroswap-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "adapter_soroswap"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
# Used only to prove the generic adapter fails against a Soroswap-shaped pair.
adapter-pool-contract = { path = "../adapter_pool" }
