[package]
name = "savings-core"
version = "0.1.0"
edition = "2021"
publish = false
build = "../../build-meta.rs"

[lib]
name = "savings_core"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
