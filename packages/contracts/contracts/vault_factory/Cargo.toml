[package]
name = "vault-factory-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "vault_factory_contract"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }
nester-access-control = { path = "../access_control" }
nester-timelock = { path = "../timelock" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
dummy-vault-fixture = { path = "../test_fixtures/dummy_vault" }
