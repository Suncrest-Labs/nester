[package]
name = "goal-rewards-contract"
version = "0.1.0"
edition = "2021"
publish = false
build = "../../build-meta.rs"

[lib]
name = "goal_rewards"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }
nester-access-control = { path = "../access_control" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
savings-goal-contract = { path = "../savings_goal" }
vault-factory-contract = { path = "../vault_factory" }
