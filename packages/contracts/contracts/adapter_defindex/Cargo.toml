[package]
name = "adapter-defindex-contract"
version = "0.1.0"
edition = "2021"
publish = false
build = "../../build-meta.rs"

[lib]
name = "adapter_defindex"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
# Parses the DeFindex vault's extracted contract spec in spec_test.rs.
soroban-spec = "=21.7.7"
savings-core = { path = "../savings_core" }
savings-reserve = { path = "../savings_reserve" }
