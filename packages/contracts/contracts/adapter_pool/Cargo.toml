[package]
name = "adapter-pool-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Clean crate name so other crates can import it as `adapter_pool`.
name = "adapter_pool"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
nester-common = { path = "../../libs/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nester-test-utils = { path = "../../libs/test_utils" }
