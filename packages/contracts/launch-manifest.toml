# =============================================================================
# Nester Mainnet Launch Manifest (Issue #1501)
#
# Single source of truth for the contracts and yield adapters that ship on
# Stellar Mainnet. Read by:
#   - Mainnet/testnet deployment scripts (`scripts/mainnet-deploy-dryrun.sh`,
#     `packages/contracts/scripts/deploy-testnet.sh`)
#   - WASM size budget gate (`packages/contracts/scripts/check-launch-manifest.sh`)
#   - Pre-deploy contract audit script (`scripts/contract-audit.sh`)
#   - Audit scope documentation (`docs/security/contract_audits.md`)
#
# Any contract crate not listed under `[contracts.*]` or `[adapters.*]` MUST
# be rejected by the mainnet deployment pipeline.
# =============================================================================

[manifest]
schema_version = 1
max_wasm_bytes = 131072 # 128 KiB Soroban mainnet WASM size limit

