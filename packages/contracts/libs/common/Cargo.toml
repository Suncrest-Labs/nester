[package]
name = "nester-common"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# alloc: attestation.rs formats a Symbol into a String to build the canonical
# payload bytes, which needs alloc::format! and the XDR conversions.
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
